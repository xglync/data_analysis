<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不良管理前端 - Demo 展示</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #1a1d23;
            --surface: #21252b;
            --surface2: #282c34;
            --border: #3a3f4b;
            --text: #abb2bf;
            --text-light: #828997;
            --primary: #61afef;
            --primary-dim: #528bbf;
            --success: #98c379;
            --warning: #e5c07b;
            --danger: #e06c75;
            --log-in: #61afef;
            --log-out: #98c379;
            --radius: 6px;
            --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
        }

        html,
        body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            font-size: 13px;
            color: var(--text);
            background: var(--bg);
            overflow: hidden;
        }

        /* ===== Header ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #e5e5e5;
        }

        .header .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface2);
            color: var(--text);
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            transition: all .15s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn:hover {
            background: #353b48;
            border-color: #555;
        }

        .btn.primary {
            background: var(--primary-dim);
            color: #fff;
            border-color: var(--primary-dim);
        }

        .btn.primary:hover {
            background: var(--primary);
        }

        .btn.danger {
            background: transparent;
            color: var(--danger);
            border-color: var(--danger);
        }

        .btn.danger:hover {
            background: #3a2528;
        }

        /* ===== Main Layout ===== */
        .main {
            display: flex;
            flex-direction: column;
            height: calc(100% - 49px);
        }

        /* ===== Split Panels ===== */
        .panels {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 1px;
            background: var(--border);
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            min-width: 0;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            font-weight: 600;
            color: #c8ccd4;
            flex-shrink: 0;
        }

        .panel-header .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot-question {
            background: var(--primary);
        }

        .dot-phone {
            background: var(--success);
        }

        .panel iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: #f5f6fa;
        }

        /* ===== Log Panel ===== */
        .log-panel {
            height: 180px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            font-weight: 600;
            color: #c8ccd4;
            flex-shrink: 0;
        }

        .log-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 1.7;
        }

        .log-item {
            display: flex;
            padding: 2px 12px;
            gap: 10px;
            align-items: flex-start;
        }

        .log-item:hover {
            background: var(--surface2);
        }

        .log-time {
            color: var(--text-light);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .log-dir {
            font-weight: 700;
            flex-shrink: 0;
            width: 16px;
            text-align: center;
        }

        .log-dir.in {
            color: var(--log-in);
        }

        .log-dir.out {
            color: var(--log-out);
        }

        .log-type {
            color: var(--warning);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .log-data {
            color: var(--text);
            word-break: break-all;
        }

        .log-empty {
            padding: 20px;
            text-align: center;
            color: var(--text-light);
            font-family: inherit;
        }

        .log-list::-webkit-scrollbar {
            width: 4px;
        }

        .log-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .log-list::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 2px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <h1>📊 不良管理前端 — Demo 展示</h1>
        <div class="actions">
            <button class="btn primary" onclick="sendDataToAll()" title="向两个页面发送 mock 数据">📨 发送测试数据</button>
            <button class="btn" onclick="clearLog()">🧹 清空日志</button>
        </div>
    </div>

    <!-- Main -->
    <div class="main">
        <!-- Panels -->
        <div class="panels">
            <!-- 问题页 -->
            <div class="panel">
                <div class="panel-header"><span class="dot dot-question"></span> 不良问题管理</div>
                <iframe id="iframeQuestion" src="question.html"></iframe>
            </div>
            <!-- 不良机页 -->
            <div class="panel">
                <div class="panel-header"><span class="dot dot-phone"></span> 不良手机管理</div>
                <iframe id="iframePhone" src="phone.html"></iframe>
            </div>
        </div>

        <!-- Log -->
        <div class="log-panel">
            <div class="log-header">
                <span>📋 消息日志</span>
                <span style="font-weight:400;font-size:11px;color:var(--text-light)">
                    <span style="color:var(--log-in)">← 子页面请求</span> &nbsp;
                    <span style="color:var(--log-out)">→ 父窗口响应</span>
                </span>
            </div>
            <div class="log-list" id="logList">
                <div class="log-empty">等待消息...</div>
            </div>
        </div>
    </div>

    <script>
        // ========== Mock 数据生成 ==========
        function generateQuestionData() {
            const types = ['外观不良', '性能不良', '装配不良', '材料不良', '电气不良'];
            const descs = {
                '外观不良': ['屏幕划痕', '外壳色差', '边框毛刺', '镜头灰尘', '按键凹陷', 'LOGO偏位'],
                '性能不良': ['电池续航不足', 'WiFi信号弱', '扬声器杂音', '触控失灵', 'GPS定位偏差'],
                '装配不良': ['螺丝漏装', '排线未扣紧', '屏蔽罩松动', '防水胶圈错位', '支架断裂'],
                '材料不良': ['PCB板分层', '连接器氧化', 'FPC断裂', '电容鼓包'],
                '电气不良': ['短路', '漏电', '静电击穿', '阻抗超差']
            };
            const severities = ['高', '中', '低'];
            const workstations = ['组装A线', '组装B线', '测试A线', '测试B线', '包装线', 'SMT线'];
            const statuses = ['待处理', '处理中', '已处理', '已关闭'];
            const reporters = ['张三', '李四', '王五', '赵六', '陈七', '周八'];

            const data = [];
            for (let i = 1; i <= 22; i++) {
                const type = types[Math.floor(Math.random() * types.length)];
                const descList = descs[type];
                data.push({
                    id: i,
                    type: type,
                    description: descList[Math.floor(Math.random() * descList.length)],
                    severity: severities[Math.floor(Math.random() * severities.length)],
                    workstation: workstations[Math.floor(Math.random() * workstations.length)],
                    status: statuses[Math.floor(Math.random() * statuses.length)],
                    date: '2026-05-' + String(20 + Math.floor(Math.random() * 11)).padStart(2, '0'),
                    reporter: reporters[Math.floor(Math.random() * reporters.length)]
                });
            }
            return data;
        }

        function generatePhoneData() {
            const models = ['X100', 'X100 Pro', 'X200', 'X200 Ultra', 'X50 Lite', 'Fold X1'];
            const workstations = ['组装A线', '组装B线', '测试A线', '测试B线', '包装线'];
            const defectTypes = ['屏幕划痕', '边框变形', '电池异常', '摄像头故障', '按键失灵', '扬声器杂音', '信号不良', '充电故障'];
            const statuses = ['待维修', '已维修', '已报废'];
            const lines = ['L1', 'L2', 'L3', 'L4'];
            const operators = ['王五', '赵六', '陈七', '周八', '吴九', '郑十'];

            const data = [];
            for (let i = 1; i <= 35; i++) {
                const ws = workstations[Math.floor(Math.random() * workstations.length)];
                const dt = defectTypes[Math.floor(Math.random() * defectTypes.length)];
                const h = String(8 + Math.floor(Math.random() * 12)).padStart(2, '0');
                const m = String(Math.floor(Math.random() * 60)).padStart(2, '0');
                data.push({
                    id: i,
                    sn: 'SN' + String(2026050000 + i),
                    model: models[Math.floor(Math.random() * models.length)],
                    workstation: ws,
                    defectType: dt,
                    status: statuses[Math.floor(Math.random() * statuses.length)],
                    line: lines[Math.floor(Math.random() * lines.length)],
                    operator: operators[Math.floor(Math.random() * operators.length)],
                    time: '2026-05-30 ' + h + ':' + m
                });
            }
            return data;
        }

        // ========== 消息日志 ==========
        const logList = document.getElementById('logList');
        let logCount = 0;

        function addLog(direction, type, data) {
            logCount++;
            if (logList.querySelector('.log-empty')) {
                logList.innerHTML = '';
            }
            const now = new Date();
            const time = now.toTimeString().slice(0, 8);
            const dirClass = direction === 'in' ? 'in' : 'out';
            const dirSymbol = direction === 'in' ? '←' : '→';
            const dataStr = data ? JSON.stringify(data).slice(0, 120) + (JSON.stringify(data).length > 120 ? '...' : '') : '—';

            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerHTML = `
    <span class="log-time">${time}</span>
    <span class="log-dir ${dirClass}">${dirSymbol}</span>
    <span class="log-type">${escHtml(type)}</span>
    <span class="log-data">${escHtml(dataStr)}</span>
  `;
            logList.appendChild(div);
            logList.scrollTop = logList.scrollHeight;
        }

        function clearLog() {
            logList.innerHTML = '<div class="log-empty">日志已清空</div>';
            logCount = 0;
        }

        function escHtml(str) {
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        // ========== 消息处理 ==========
        window.addEventListener('message', function (e) {
            const msg = e.data;
            if (!msg || !msg.type) return;

            // 确定来自哪个 iframe
            const iframeQ = document.getElementById('iframeQuestion');
            const iframeP = document.getElementById('iframePhone');
            let targetFrame = null;
            if (e.source === iframeQ.contentWindow) targetFrame = iframeQ;
            else if (e.source === iframeP.contentWindow) targetFrame = iframeP;

            addLog('in', msg.type, msg.data);

            switch (msg.type) {
                case 'REQ_DATA_QUESTION':
                    // 子页面请求问题数据
                    const qData = generateQuestionData();
                    addLog('out', 'RES_DATA_QUESTION', { count: qData.length });
                    if (targetFrame) {
                        targetFrame.contentWindow.postMessage({ type: 'RES_DATA_QUESTION', data: qData }, '*');
                    }
                    break;

                case 'REQ_DATA_PHONE':
                    // 子页面请求手机数据
                    const pData = generatePhoneData();
                    addLog('out', 'RES_DATA_PHONE', { count: pData.length });
                    if (targetFrame) {
                        targetFrame.contentWindow.postMessage({ type: 'RES_DATA_PHONE', data: pData }, '*');
                    }
                    break;

                // 问题页右键菜单操作
                case 'QUESTION_DETAIL':
                case 'QUESTION_MARK_RESOLVED':
                case 'QUESTION_ASSIGN':
                case 'QUESTION_EXPORT':
                case 'QUESTION_DELETE':
                    addLog('out', msg.type + '_ACK', { status: 'received', ...msg.data });
                    // 模拟父窗口确认
                    if (targetFrame) {
                        targetFrame.contentWindow.postMessage({
                            type: 'OPERATION_RESULT',
                            data: { msgId: msg.type, success: true, message: '操作已接收: ' + msg.type }
                        }, '*');
                    }
                    break;

                // 不良机页操作（右键菜单 + 双击 + 拖拽到问题）
                case 'PHONE_BATCH_REPAIR':
                case 'PHONE_BATCH_SCRAP':
                case 'PHONE_EXPORT_SELECTED':
                case 'PHONE_COPY_SN':
                case 'PHONE_SELECT_CURRENT_GROUP':
                case 'PHONE_CLEAR_SELECTION':
                case 'PHONE_DBLCLICK':
                case 'PHONE_TO_QUESTION':
                    addLog('out', msg.type + '_ACK', { status: 'received', ...msg.data });
                    if (targetFrame) {
                        targetFrame.contentWindow.postMessage({
                            type: 'OPERATION_RESULT',
                            data: { msgId: msg.type, success: true, message: '操作已接收: ' + msg.type }
                        }, '*');
                    }
                    break;

                default:
                    // 未知消息类型
                    addLog('out', 'UNKNOWN_MSG', { originalType: msg.type });
            }
        });

        // ========== 按钮操作 ==========
        function sendDataToAll() {
            const iframeQ = document.getElementById('iframeQuestion');
            const iframeP = document.getElementById('iframePhone');

            if (iframeQ.contentWindow) {
                const qData = generateQuestionData();
                iframeQ.contentWindow.postMessage({ type: 'RES_DATA_QUESTION', data: qData }, '*');
                addLog('out', 'RES_DATA_QUESTION', { count: qData.length, target: '问题页' });
            }
            if (iframeP.contentWindow) {
                const pData = generatePhoneData();
                iframeP.contentWindow.postMessage({ type: 'RES_DATA_PHONE', data: pData }, '*');
                addLog('out', 'RES_DATA_PHONE', { count: pData.length, target: '不良机页' });
            }
        }

        // ========== 初始化：iframe 加载后主动发送数据 ==========
        // 子页面加载后会发送 REQ_DATA_*，父窗口在 message listener 中响应。
        // 以下作为兜底：延迟 300ms 后若仍未响应则主动推送。
        let qLoaded = false, pLoaded = false;
        document.getElementById('iframeQuestion').addEventListener('load', function () {
            qLoaded = true;
            // 给子页面一点时间发送请求，然后兜底推送
            setTimeout(() => {
                if (qLoaded && !logList.querySelector('.log-item')) {
                    // 日志中还没有消息，说明子页面可能未成功请求，主动推送
                    sendDataToAll();
                }
            }, 500);
        });
        document.getElementById('iframePhone').addEventListener('load', function () {
            pLoaded = true;
        });
    </script>
</body>

</html>
