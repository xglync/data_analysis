<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合并视图 — Demo 展示</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #1a1d23;
      --surface: #21252b;
      --surface2: #282c34;
      --border: #3a3f4b;
      --text: #abb2bf;
      --text-light: #828997;
      --primary: #61afef;
      --primary-dim: #528bbf;
      --success: #98c379;
      --warning: #e5c07b;
      --danger: #e06c75;
      --log-in: #61afef;
      --log-out: #98c379;
      --radius: 6px;
      --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
    }

    html,
    body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
    }

    /* ===== Header ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #e5e5e5;
    }

    .header .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: all .15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn:hover {
      background: #353b48;
      border-color: #555;
    }

    .btn.primary {
      background: var(--primary-dim);
      color: #fff;
      border-color: var(--primary-dim);
    }

    .btn.primary:hover {
      background: var(--primary);
    }

    /* ===== Main Layout ===== */
    .main {
      display: flex;
      flex-direction: column;
      height: calc(100% - 49px);
    }

    .iframe-wrap {
      flex: 1;
      min-height: 0;
    }

    .iframe-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #f5f6fa;
    }

    /* ===== Log Panel ===== */
    .log-panel {
      height: 200px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: #c8ccd4;
      flex-shrink: 0;
    }

    .log-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.7;
    }

    .log-item {
      display: flex;
      padding: 2px 12px;
      gap: 10px;
      align-items: flex-start;
    }

    .log-item:hover {
      background: var(--surface2);
    }

    .log-time {
      color: var(--text-light);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .log-dir {
      font-weight: 700;
      flex-shrink: 0;
      width: 16px;
      text-align: center;
    }

    .log-dir.in {
      color: var(--log-in);
    }

    .log-dir.out {
      color: var(--log-out);
    }

    .log-type {
      color: var(--warning);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .log-data {
      color: var(--text);
      word-break: break-all;
    }

    .log-highlight {
      color: var(--success);
      font-weight: 700;
    }

    .log-empty {
      padding: 20px;
      text-align: center;
      color: var(--text-light);
      font-family: inherit;
    }

    .log-list::-webkit-scrollbar {
      width: 4px;
    }

    .log-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .log-list::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 2px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>📊 合并视图 — Demo 展示</h1>
    <div class="actions">
      <button class="btn primary" onclick="sendData()" title="向合并页发送 mock 数据">📨 发送测试数据</button>
      <button class="btn" onclick="clearLog()">🧹 清空日志</button>
    </div>
  </div>

  <div class="main">
    <div class="iframe-wrap">
      <iframe id="iframeCombine" src="combine.html#id=demo_combine"></iframe>
    </div>
    <div class="log-panel">
      <div class="log-header">
        <span>📋 消息日志</span>
        <span style="font-weight:400;font-size:11px;color:var(--text-light)">
          <span style="color:var(--log-in)">← 子页面请求</span> &nbsp;
          <span style="color:var(--log-out)">→ 父窗口响应</span> &nbsp;
          <span style="color:var(--success)">✨ 拖拽关联</span>
        </span>
      </div>
      <div class="log-list" id="logList">
        <div class="log-empty">等待消息...</div>
      </div>
    </div>
  </div>

  <script>
    // ========== Mock 数据生成 ==========
    function generateQuestionData() {
      const types = ['外观不良', '性能不良', '装配不良', '材料不良', '电气不良'];
      const problems = {
        '外观不良': ['屏幕划痕', '外壳色差', '边框毛刺', '镜头灰尘', '按键凹陷', 'LOGO偏位', '后盖玻璃碎裂+中框变形严重需要整体更换模组'],
        '性能不良': ['电池续航不足', 'WiFi信号弱', '扬声器杂音', '触控失灵', 'GPS定位偏差', '主板电源管理芯片异常导致待机功耗超标发热严重'],
        '装配不良': ['螺丝漏装', '排线未扣紧', '屏蔽罩松动', '防水胶圈错位', '支架断裂', '前摄支架安装偏位导致摄像头光轴偏移需重新校准'],
        '材料不良': ['PCB板分层', '连接器氧化', 'FPC断裂', '电容鼓包'],
        '电气不良': ['短路', '漏电', '静电击穿', '阻抗超差', '射频PA输出功率不达标导致信号衰减严重需更换射频模组']
      };
      const levels = ['高', '中', '低'];
      const stations = ['组装A线', '组装B线', '测试A线', '测试B线', '包装线', 'SMT线'];
      const statuses = ['待处理', '处理中', '已处理', '已关闭'];
      const incharges = ['张三', '李四', '王五', '赵六', '陈七', '周八'];

      const data = [];
      for (let i = 1; i <= 20; i++) {
        const type = types[Math.floor(Math.random() * types.length)];
        data.push({
          id: i, type,
          problem: problems[type][Math.floor(Math.random() * problems[type].length)],
          level: levels[Math.floor(Math.random() * levels.length)],
          station: stations[Math.floor(Math.random() * stations.length)],
          status: statuses[Math.floor(Math.random() * statuses.length)],
          create_time: '2026-06-' + String(10 + Math.floor(Math.random() * 15)).padStart(2, '0'),
          incharge: incharges[Math.floor(Math.random() * incharges.length)]
        });
      }
      return data;
    }

    function generatePhoneData() {
      const models = ['X100', 'X100 Pro Max Ultra', 'X200', 'X200 Ultra Platinum Edition', 'X50 Lite', 'Fold X1 Pro'];
      const stations = ['组装A线-三楼东区', '组装B线', '测试A线-品质检测中心', '测试B线', '包装线'];
      const analyses = ['屏幕划痕', '边框变形+外壳开裂', '电池异常鼓包', '摄像头模组故障(主摄)', '按键失灵', '扬声器杂音严重', '信号不良-射频天线接触不良', '充电接口故障(TYPE-C)'];
      const remarks = ['初步判定来料不良', '待拆机进一步确认', '已送实验室分析', '疑似装配过程中受损', '测试环境异常导致', '复测后确认不良'];
      const statuses = ['待维修', '已维修', '已报废'];
      const lines = ['L1-主产线', 'L2', 'L3-辅线A组', 'L4'];
      const operators = ['王五', '赵六', '陈七(夜班)', '周八', '吴九-代理组长', '郑十'];

      const data = [];
      for (let i = 1; i <= 35; i++) {
        const ws = stations[Math.floor(Math.random() * stations.length)];
        const an = analyses[Math.floor(Math.random() * analyses.length)];
        const h = String(8 + Math.floor(Math.random() * 12)).padStart(2, '0');
        const m = String(Math.floor(Math.random() * 60)).padStart(2, '0');
        const barcode = 'BC' + String(2026060000 + i) + (i % 5 === 0 ? '-BATCH-A3-XYZ' : '');
        data.push({
          id: i, barcode,
          model: models[Math.floor(Math.random() * models.length)],
          station: ws,
          remark: remarks[Math.floor(Math.random() * remarks.length)],
          analysis: an,
          problem_id: Math.floor(Math.random() * 20) + 1,
          status: statuses[Math.floor(Math.random() * statuses.length)],
          line: lines[Math.floor(Math.random() * lines.length)],
          operator: operators[Math.floor(Math.random() * operators.length)],
          entry_time: '2026-06-' + String(10 + Math.floor(Math.random() * 15)).padStart(2, '0') + ' ' + h + ':' + m
        });
      }
      return data;
    }

    // ========== 消息日志 ==========
    const logList = document.getElementById('logList');
    let logCount = 0;

    function addLog(direction, type, data, highlight) {
      logCount++;
      if (logList.querySelector('.log-empty')) logList.innerHTML = '';
      const now = new Date();
      const time = now.toTimeString().slice(0, 8);
      const dirClass = direction === 'in' ? 'in' : 'out';
      const dirSymbol = direction === 'in' ? '←' : '→';
      const dataStr = data ? JSON.stringify(data).slice(0, 140) + (JSON.stringify(data).length > 140 ? '...' : '') : '—';

      const div = document.createElement('div');
      div.className = 'log-item';
      div.innerHTML = `<span class="log-time">${time}</span>
    <span class="log-dir ${dirClass}">${dirSymbol}</span>
    <span class="log-type ${highlight ? 'log-highlight' : ''}">${escHtml(type)}</span>
    <span class="log-data">${escHtml(dataStr)}</span>`;
      logList.appendChild(div);
      logList.scrollTop = logList.scrollHeight;
    }

    function clearLog() { logList.innerHTML = '<div class="log-empty">日志已清空</div>'; logCount = 0; }

    function escHtml(str) {
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }

    // ========== 消息处理 ==========
    window.addEventListener('message', function (e) {
      const msg = e.data;
      if (!msg || !msg.type) return;

      const iframe = document.getElementById('iframeCombine');
      const isCombine = e.source === iframe.contentWindow;

      addLog('in', msg.type, msg.data);

      switch (msg.type) {
        // 数据请求
        case 'REQ_DATA_QUESTION':
          if (isCombine) {
            const qData = generateQuestionData();
            addLog('out', 'RES_DATA_QUESTION', { count: qData.length });
            iframe.contentWindow.postMessage({ type: 'RES_DATA_QUESTION', data: qData }, '*');
          }
          break;

        case 'REQ_DATA_PHONE':
          if (isCombine) {
            const pData = generatePhoneData();
            addLog('out', 'RES_DATA_PHONE', { count: pData.length });
            iframe.contentWindow.postMessage({ type: 'RES_DATA_PHONE', data: pData }, '*');
          }
          break;

        // 问题页右键菜单
        case 'QUESTION_DETAIL':
        case 'QUESTION_MARK_RESOLVED':
        case 'QUESTION_ASSIGN':
        case 'QUESTION_EXPORT':
        case 'QUESTION_DELETE':
          addLog('out', msg.type + '_ACK', { status: 'received', ...msg.data });
          if (isCombine) {
            iframe.contentWindow.postMessage({
              type: 'OPERATION_RESULT',
              data: { msgId: msg.type, success: true, message: '操作已接收: ' + msg.type }
            }, '*');
          }
          break;

        // 不良机页操作（右键菜单 + 双击）
        case 'PHONE_BATCH_REPAIR':
        case 'PHONE_BATCH_SCRAP':
        case 'PHONE_EXPORT_SELECTED':
        case 'PHONE_COPY_SN':
        case 'PHONE_SELECT_CURRENT_GROUP':
        case 'PHONE_CLEAR_SELECTION':
        case 'PHONE_DBLCLICK':
          addLog('out', msg.type + '_ACK', { status: 'received', ...msg.data });
          if (isCombine) {
            iframe.contentWindow.postMessage({
              type: 'OPERATION_RESULT',
              data: { msgId: msg.type, success: true, message: '操作已接收: ' + msg.type }
            }, '*');
          }
          break;

        // 拖拽关联（高亮显示）
        case 'PHONE_TO_QUESTION':
          addLog('out', 'PHONE_TO_QUESTION_ACK', {
            status: 'received',
            phoneCount: msg.data?.phones?.length || 0,
            questionId: msg.data?.question?.id,
            action: 'drag_assign'
          }, true);
          if (isCombine) {
            iframe.contentWindow.postMessage({
              type: 'OPERATION_RESULT',
              data: { msgId: msg.type, success: true, message: '已将 ' + (msg.data?.phones?.length || 0) + ' 台不良机关联到问题 #' + msg.data?.question?.id },
              instanceId: 'demo_combine'
            }, '*');
          }
          break;

        // 双击问题 → 返回筛选手机数据
        case 'QUESTION_QUERY_PHONES':
          if (isCombine) {
            const qid = msg.data?.questionId;
            const allPhone = generatePhoneData();
            const filtered = allPhone.filter(p => p.problem_id === qid);
            if (filtered.length < 2) {
              for (let i = 0; i < 5 && i < allPhone.length; i++) {
                if (!filtered.find(f => f.id === allPhone[i].id)) filtered.push(allPhone[i]);
              }
            }
            addLog('out', 'RES_DATA_FILTERED_PHONES', { questionId: qid, count: filtered.length });
            iframe.contentWindow.postMessage({
              type: 'RES_DATA_FILTERED_PHONES', data: filtered, instanceId: 'demo_combine'
            }, '*');
          }
          break;

        default:
          addLog('out', 'UNKNOWN_MSG', { originalType: msg.type });
      }
    });

    // ========== 按钮操作 ==========
    function sendData() {
      const iframe = document.getElementById('iframeCombine');
      if (!iframe.contentWindow) return;
      const qData = generateQuestionData();
      iframe.contentWindow.postMessage({ type: 'RES_DATA_QUESTION', data: qData, instanceId: 'demo_combine' }, '*');
      addLog('out', 'RES_DATA_QUESTION', { count: qData.length });
      const pData = generatePhoneData();
      iframe.contentWindow.postMessage({ type: 'RES_DATA_PHONE', data: pData, instanceId: 'demo_combine' }, '*');
      addLog('out', 'RES_DATA_PHONE', { count: pData.length });
    }

    // ========== 初始化：iframe 加载后自动发送数据 ==========
    document.getElementById('iframeCombine').addEventListener('load', function () {
      setTimeout(() => sendData(), 300);
    });
  </script>
</body>

</html>
