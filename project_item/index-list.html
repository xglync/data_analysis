<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>List Demo</title>
</head>

<body style="margin:20px; font-family: sans-serif;">
    <h2>List Widget Demo</h2>
    <p style="color:#666; font-size:14px;">Features: Virtual Scroll, High Performance, Custom Template</p>

    <iframe id="listFrame" src="widget.html" style="width: 100%; height: 600px; border: 1px solid #ccc;"></iframe>

    <script>
        const frame = document.getElementById('listFrame');

        // 模拟 10万条日志数据
        const logData = Array.from({ length: 1 }, (_, i) => ({
            id: i,
            level: Math.random() > 0.9 ? 'ERROR' : (Math.random() > 0.7 ? 'WARN' : 'INFO'),
            msg: `System event log message #${i} generated by server cluster.`,
            ts: new Date().toISOString()
        }));

        window.addEventListener('message', (e) => {
            const { type, payload } = e.data;
            if (type === 'READY') {
                frame.contentWindow.postMessage({
                    type: 'INIT',
                    payload: {
                        config: {
                            type: 'list', // 指定根控件为 List
                            rowHeight: 60, // 设置较大的行高

                            // 复杂的 HTML 模板
                            template: `
                                <div style="display:flex; flex-direction:column; justify-content:center; width:100%;">
                                    <div style="display:flex; align-items:center; margin-bottom:4px;">
                                        <span style="
                                            padding:2px 6px; border-radius:4px; font-size:12px; font-weight:bold; color:#fff;
                                            background-color: \${row.level === 'ERROR' ? '#f5222d' : (row.level === 'WARN' ? '#fa8c16' : '#52c41a')}
                                        ">\${row.level}</span>
                                        <span style="margin-left:10px; font-weight:bold; color:#333;">ID: \${row.id}</span>
                                        <span style="margin-left:auto; color:#999; font-size:12px;">\${row.ts}</span>
                                    </div>
                                    <div style="color:#666; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                                        \${row.msg}
                                    </div>
                                </div>
                            `
                        },
                        data: logData
                    }
                }, '*');
            }
            if (type === 'TRACK') console.log('[LIST TRACK]', payload.event, payload);
        });
    </script>
</body>

</html>
