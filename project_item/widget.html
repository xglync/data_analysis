<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/grid.css">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="grid-root" class="grid-container"></div>
    <script type="module">
        import { MessageBus } from './js/core/message-bus.js';
        import { Grid } from './js/core/grid.js';
        import './js/adapters/grid-adapter.js';

        const bus = new MessageBus();
        // 根表格 ID 设为 'root'
        const grid = new Grid('grid-root', bus, 'root');

        bus.on('INIT', ({ config, data }) => {
            grid.init(config, data);
        });
        bus.on('SET_DATA', (data) => grid.dataEngine.loadData(data));
        bus.emit('READY', true);
    </script>
</body>

</html>
