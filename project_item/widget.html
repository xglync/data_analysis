<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/grid.css">
    <link rel="stylesheet" href="css/list.css">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="widget-root" class="grid-container"></div>
    <script type="module">
        import { MessageBus } from './js/core/message-bus.js';
        import { widgetFactory } from './js/core/widget-factory.js';

        import './js/adapters/grid-adapter.js';
        import './js/adapters/list-adapter.js';
        // 【新增】引入 Quill 适配器
        import './js/adapters/quill-adapter.js';

        const bus = new MessageBus();
        let rootWidget = null;

        bus.on('INIT', ({ config, data }) => {
            const root = document.getElementById('widget-root');
            const type = config.type || 'list';

            // 【关键修复】如果已经初始化过，且类型一致，不要重新创建实例
            // 重新创建会导致 DOM 被清空，滚动条直接回到顶部
            if (rootWidget && rootWidget.id === 'root') {
                console.log("Root widget exists, performing soft init/update.");
                if (rootWidget.init) rootWidget.init(config, data);
                return;
            }

            const definition = {
                type: type,
                config: config,
            };

            rootWidget = widgetFactory.create(root, definition, null, null, bus, 'root');

            if (rootWidget && rootWidget.init) {
                rootWidget.init(config, data);
            }
        });

        bus.on('SET_DATA', (data) => {
            if (rootWidget && rootWidget.init) {
                // 假设 init 逻辑支持增量或全量更新
                rootWidget.init(rootWidget.config, data);
            }
        });

        bus.emit('READY', true);
    </script>
</body>

</html>
