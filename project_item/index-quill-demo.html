                console.log('Wrapper ready, sending data...');
                wrapper.contentWindow.postMessage({
                    type: 'INIT_QUILL_LIST',
                    payload: mockData
                }, '*');
            }

            if (type === 'EDITOR_CHANGE') {
                const div = document.createElement('div');
                div.className = 'log-item';
                div.innerHTML = `
                    <div><strong>${payload.duration}</strong></div>
