<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Quill List Wrapper</title>
    <style>
        html,
        body,
        iframe {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: none;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <iframe id="innerWidget" src="widget.html"></iframe>

    <script>
        const iframe = document.getElementById('innerWidget');

        window.addEventListener('message', (e) => {
            const { type, payload } = e.data;

            if (type === 'INIT_QUILL_LIST') {
                const rawData = payload;

                iframe.contentWindow.postMessage({
                    type: 'INIT',
                    payload: {
                        config: {
                            type: 'list',
                            primaryKeys: ['id'],

                            // 【关键配置】设置为 auto，启用高度自适应
                            rowHeight: 'auto',
                            // 预估高度，用于初始滚动条计算
                            estimatedRowHeight: 200,

                            // 【关键修复】在 auto 模式下，关闭子容器的溢出隐藏
                            // 确保滚轮事件能冒泡到 List 容器，从而触发虚拟滚动
                            overflow: 'hidden',

                            itemWidget: {
                                type: 'quill',
                                dataResolver: `return row;`
                            }
                        },
                        data: rawData
                    }
                }, '*');
            }
        });

        window.addEventListener('message', (e) => {
            const { type, payload } = e.data;

            if (type === 'QUILL_UPDATED') {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'EDITOR_CHANGE',
                        payload: payload
                    }, '*');
                }
            }

            if (type === 'READY') {
                if (window.parent) window.parent.postMessage({ type: 'WRAPPER_READY' }, '*');
            }
        });
    </script>
</body>

</html>
